context:
  version: "2.3.3"
  libdovi_version: "3.3.2"
  dovi_tool_build_number: 1
  libdovi_build_number: 4

recipe:
  name: dovi_tool
  version: ${{ version }}

source:
  - url: https://github.com/quietvoid/dovi_tool/archive/refs/tags/${{ version }}.tar.gz
    sha256: b4906f67b339b10f885a5c7d89364a359cbd3845f3b95115cac5d7964e13422d
    target_directory: dovi_tool_src
  - url: https://github.com/quietvoid/dovi_tool/archive/refs/tags/libdovi-${{ libdovi_version }}.tar.gz
    sha256: 8ccb1922d7dbb57bc4f2c15c10b90c462f7a5f292efe317c116db923728dd3f1
    target_directory: libdovi_src

build:
  number: 0

outputs:
  - package:
      name: dovi_tool
      version: ${{ version }}
    build:
      script: build-dovi_tool
    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('rust') }}
        - cargo-auditable
        - cargo-bundle-licenses
        - if: linux
          then:
            - pkg-config
      host:
        - if: linux
          then:
            - fontconfig
            - freetype
      ignore_run_exports:
        from_package:
          # fontconfig pulls expat transitively on Linux, but the Rust binary
          # uses the crate's dlopen mode rather than linking against libexpat.
          - expat
    tests:
      - script:
          - if: build_platform == target_platform or target_platform == "linux-aarch64" # no emulation for osx-arm64
            then:
              - dovi_tool --help
              - dovi_tool --version
      - package_contents:
          strict: true
          bin:
            - dovi_tool
          files:
            exists:
              - etc/conda/test-files/dovi_tool/**/check-no-static-libs.py
            # Keep the CLI output free of library artifacts.
            not_exists:
              - "**/*.a"
              - "**/pkgconfig/*.pc"
              - if: unix
                then:
                  - include/**
                  - lib/libdovi*
              - if: win
                then:
                  - Library/include/**
                  - Library/bin/dovi.dll
                  - Library/lib/dovi*.lib
                  - Library/lib/dovi.def
      - script:
          - if: build_platform == target_platform or target_platform == "linux-aarch64"
            then:
              - python check-no-static-libs.py dovi_tool
        requirements:
          run:
            - python
        files:
          recipe:
            - check-no-static-libs.py
    about:
      homepage: https://github.com/quietvoid/dovi_tool
      repository: https://github.com/quietvoid/dovi_tool
      documentation: https://github.com/quietvoid/dovi_tool/blob/main/README.md
      summary: CLI utilities for working with Dolby Vision metadata and HEVC streams
      description: Command-line tools for inspecting, converting, extracting, and muxing Dolby Vision metadata and related HEVC bitstreams.
      license: MIT
      license_file:
        - dovi_tool_src/LICENSE
        - THIRDPARTY_dovi_tool.yml

  - package:
      name: libdovi
      version: ${{ libdovi_version }}
    build:
      number: 0
      script: build-libdovi
    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('rust') }}
        - cargo-bundle-licenses
        - cargo-c
        - if: unix
          then:
            - pkg-config
      run_exports:
        - ${{ pin_subpackage('libdovi', upper_bound='x') }}
    tests:
      - package_contents:
          include:
            - libdovi/rpu_parser.h
          files:
            exists:
              - if: linux
                then: lib/libdovi.so*
              - if: osx
                then: lib/libdovi*.dylib
              - if: win
                then:
                  - Library/bin/dovi.dll
                  - Library/lib/dovi.dll.lib
              - "**/pkgconfig/dovi.pc"
            # check no static libs are present
            not_exists:
              - "**/*.a"
      - script:
          - if: build_platform == target_platform or target_platform == "linux-aarch64"
            then:
              - python check-no-static-libs.py libdovi
        requirements:
          run:
            - python
        files:
          recipe:
            - check-no-static-libs.py
      # test pkg-config can find the library and print the correct version (run export done ok)
      - script:
          - if: unix
            then:
              - export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig"
              - pkg-config --exists dovi
        requirements:
          run:
            - if: unix
              then:
                - pkg-config
    about:
      homepage: https://github.com/quietvoid/dovi_tool/tree/main/dolby_vision
      repository: https://github.com/quietvoid/dovi_tool
      documentation: https://github.com/quietvoid/dovi_tool/blob/main/dolby_vision/README.md
      summary: C library to read and write Dolby Vision metadata
      description: Shared C library and headers for parsing, writing, and packaging Dolby Vision metadata.
      license: MIT
      license_file:
        - libdovi_src/dolby_vision/LICENSE
        - THIRDPARTY_libdovi.yml

about:
  homepage: https://github.com/quietvoid/dovi_tool
  repository: https://github.com/quietvoid/dovi_tool
  documentation: https://github.com/quietvoid/dovi_tool/blob/main/README.md
  summary: CLI tools and a C library for working with Dolby Vision metadata
  description: Split packaging for the dovi_tool command-line utilities and the libdovi shared C library used for Dolby Vision metadata workflows.
  license: MIT
  license_file: dovi_tool_src/LICENSE

extra:
  feedstock-name: dovi_tool
  recipe-maintainers:
    - ndeybach
